apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: rescue-lens-api
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: gcr.io/YOUR_PROJECT_ID/rescue-lens-api:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 1Gi
              cpu: "1"
          env:
            - name: ENV
              value: production
            - name: GEMINI_MODEL
              value: gemini-1.5-pro
            - name: GOOGLE_CLOUD_PROJECT
              value: YOUR_PROJECT_ID
            - name: GCS_BUCKET_NAME
              value: rescue-lens-images
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rescue-lens-api-key
                  key: latest
          livenessProbe:
            httpGet:
              path: /health
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
            initialDelaySeconds: 5
            periodSeconds: 10
